name: Supply Chain
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_call:
    inputs:
      run-code-scanning:
        default: true
        type: boolean
        required: false
      codeql-code-scanning-category:
        default: codeql-code-scanning
        type: string
        required: false
      codeql-code-scanning-config-file:
        default:
        type: string
        required: false
      codeql-go-version:
        type: string
        required: false
      codeql-java-version:
        default: "17"
        type: string
        required: false
      codeql-java-cache:
        default:
        type: string
        required: false
      codeql-java-distribution:
        default: temurin
        type: string
        required: false
      code-scanning-timeout-minutes:
        default: 10
        type: number
        required: false
      trivy-code-scanning-category:
        default: trivy-code-scanning
        type: string
        required: false
      runner-cores:
        default: 2
        type: number
        required: false
    secrets: {}
jobs:
  validate:
    name: Validate
    if: failure()
    runs-on: ubuntu-slim
    permissions: {}
    needs:
      - dependency-review-preliminary
      - dependency-review
      - code-scanning
    # temparary disable trivy until this is fixed
    # https://github.com/aquasecurity/trivy-action/issues/541
    #  - trivy
    steps:
      - run: exit 1
        name: "Catch errors"

  dependency-review-preliminary:
    name: Preliminary Dependency Review
    runs-on: ubuntu-slim

    if: github.event_name == 'pull_request'
    outputs:
      outcome: ${{ steps.dependency-review.outcome }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dependency Review
        id: dependency-review
        # Failures are judged by the dependency-review job
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-slim
    needs: dependency-review-preliminary
    if: needs.dependency-review-preliminary.outputs.outcome == 'failure'
    permissions:
      contents: read
    steps:
      - name: Check for newly introduced vulnerabilities
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const { base, head } = context.payload.pull_request;
            const changes = await github.paginate(
              'GET /repos/{owner}/{repo}/dependency-graph/compare/{basehead}',
              { owner, repo, basehead: `${base.sha}...${head.sha}` },
            );

            // Net count per package advisory: added occurrences minus removed occurrences
            const counts = new Map();
            for (const change of changes) {
              const delta = change.change_type === 'added' ? 1 : -1;
              for (const vulnerability of change.vulnerabilities ?? []) {
                const key = `${change.ecosystem}/${change.name} ${vulnerability.advisory_ghsa_id} (${vulnerability.severity})`;
                counts.set(key, (counts.get(key) ?? 0) + delta);
              }
            }

            const addsVulnerable = changes.some(c => c.change_type === 'added' && c.vulnerabilities?.length);
            const introduced = [...counts].filter(([, count]) => count > 0).map(([key]) => key);

            if (!addsVulnerable) {
              core.setFailed('Dependency review failed for a reason other than vulnerable dependencies.');
            } else if (introduced.length > 0) {
              core.setFailed(`New vulnerabilities are introduced:\n${introduced.join('\n')}`);
            } else {
              core.info('Vulnerable dependencies changed, but no new vulnerabilities are introduced.');
            }

  code-scanning:
    name: CodeQL Scan
    runs-on:
      group: ubuntu-latest-large-pool
      labels: ubuntu-latest-${{ inputs.runner-cores }}core
    timeout-minutes: ${{ inputs.code-scanning-timeout-minutes }}
    if: ${{ inputs.run-code-scanning == true && github.event_name != 'pull_request' }}
    permissions:
      security-events: write
      actions: read
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure access to internal and private GitHub repos
        run: git config --global url."https://${{ secrets.REVIEWBOT_GITHUB_TOKEN }}:x-oauth-basic@github.com/coopnorge".insteadOf "https://github.com/coopnorge"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: coopnorge/github-workflow-supply-chain-security-validation
          sparse-checkout: |
            docker-compose.yaml
          path: .tmp-github-workflow-supply-chain-security-validation
      - name: Detected Languages
        id: detected-languages
        run: |
          set -euo pipefail
          DOCKER_COMPOSE_PATH=$(mktemp ./docker-compose.XXXXXXXXXX.yaml)
          mv ".tmp-github-workflow-supply-chain-security-validation/docker-compose.yaml" "$DOCKER_COMPOSE_PATH"
          export USER_ID=$(id -u) && export GROUP_ID=$(id -g)
          echo "languages=$(docker compose -f $DOCKER_COMPOSE_PATH run --rm linguist | awk '{print $3}' | paste -sd ',' -)" >> $GITHUB_OUTPUT
          rm "$DOCKER_COMPOSE_PATH"
          rm -rf ".tmp-github-workflow-supply-chain-security-validation"
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        name: Get CodeQL supported languages
        id: languages
        with:
          result-encoding: json
          script: |
            const linguistCodeQLMapping = {
              'c#': 'csharp',
            };
            function getCodeQLLanguage(linguistLang) {
              if (linguistLang in linguistCodeQLMapping) {
                return linguistCodeQLMapping[linguistLang];
              }
              return linguistLang;
            }
            const detectedLanguages = '${{ steps.detected-languages.outputs.languages }}'.toLowerCase().split(',').map(language => {
              return getCodeQLLanguage(language)
            });

            // Always scan for actions
            // linguist does not find GitHub actions and they always exist if this workflow is running
            // So, always add it.
            detectedLanguages.push('actions');

            const codeqlLanguages = ['c', 'cpp', 'csharp', 'go', 'python', 'java', 'javascript', 'typescript', 'actions', 'kotlin', 'scala'];
            const languages = detectedLanguages.filter(language => codeqlLanguages.includes(language));
            return languages;

      - name: "Determine Go version"
        run: |
          if [ -z "${{ inputs.codeql-go-version }}" ]; then
            echo "GO_VERSION=stable" >> $GITHUB_ENV
            echo "GO_CHECK_LATEST=true" >> $GITHUB_ENV
          else
            echo "GO_VERSION=${{ inputs.codeql-go-version }}" >> $GITHUB_ENV
            echo "GO_CHECK_LATEST=false" >> $GITHUB_ENV
          fi
      - name: Set Go version
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: ${{ env.GO_CHECK_LATEST }}
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Set Java version
        if: contains(fromJSON(steps.languages.outputs.result), 'java') || contains(fromJSON(steps.languages.outputs.result), 'scala') || contains(fromJSON(steps.languages.outputs.result), 'kotlin')
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: ${{ inputs.codeql-java-distribution }}
          java-version: ${{ inputs.codeql-java-version }}
          cache: ${{ inputs.codeql-java-cache }}
      - name: Setup Maven settings
        if: ${{ env.MAVEN_SETTINGS != '' }}
        env:
          MAVEN_SETTINGS: ${{ secrets.MAVEN_SETTINGS_BASE64 }}
        run: |
          mkdir -p ~/.m2
          echo $MAVEN_SETTINGS | base64 -d > ~/.m2/settings.xml

      - name: Initialize CodeQL
        if: steps.languages.outputs.result != '[]'
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          config-file: ${{ inputs.codeql-code-scanning-config-file }}
          languages: ${{ join(fromJSON(steps.languages.outputs.result), ',') }}
      - name: Add coopnorge Nuget source
        if: contains(fromJSON(steps.languages.outputs.result), 'csharp')
        run: |
          dotnet nuget add source --username USERNAME --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/coopnorge/index.json"
      - name: Autobuild
        if: steps.languages.outputs.result != '[]'
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      - name: Perform CodeQL Analysis
        if: steps.languages.outputs.result != '[]'
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: ${{ inputs.codeql-code-scanning-category }}

  # temparary disable trivy until this is fixed
  # https://github.com/aquasecurity/trivy-action/issues/541
